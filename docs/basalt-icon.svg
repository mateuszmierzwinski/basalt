<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- basalt — a colonnade of hexagonal columns in dark glass.
     Isometric and block-built like Bazel's mark, so the kinship reads;
     hexagonal rather than cubic, and glass rather than green, so it is
     not mistaken for it. Bases dissolve rather than being cut off. -->
<defs>
  <linearGradient id="top" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#4a6377"/><stop offset="1" stop-color="#16212b"/></linearGradient>
  <linearGradient id="topA" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#c2843c"/><stop offset="1" stop-color="#3a1d0b"/></linearGradient>
  <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26343f" stop-opacity="0.96"/><stop offset="0.45" stop-color="#0b1116" stop-opacity="0.92"/><stop offset="0.88" stop-color="#0b1116" stop-opacity="0"/><stop offset="1" stop-color="#0b1116" stop-opacity="0"/></linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18222b" stop-opacity="0.96"/><stop offset="0.45" stop-color="#070c10" stop-opacity="0.92"/><stop offset="0.88" stop-color="#070c10" stop-opacity="0"/><stop offset="1" stop-color="#070c10" stop-opacity="0"/></linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#31434f" stop-opacity="0.96"/><stop offset="0.45" stop-color="#0e161d" stop-opacity="0.92"/><stop offset="0.88" stop-color="#0e161d" stop-opacity="0"/><stop offset="1" stop-color="#0e161d" stop-opacity="0"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e6f7ff" stop-opacity="0.5"/>
    <stop offset="0.5" stop-color="#e6f7ff" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#e6f7ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rimFade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9fdcef" stop-opacity="0.55"/>
    <stop offset="0.5" stop-color="#9fdcef" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#9fdcef" stop-opacity="0"/>
  </linearGradient>
</defs>
